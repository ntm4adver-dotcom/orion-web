{% extends "base.html" %}
{% block title %}الشارت - Orion{% endblock %}
{% block content %}

<div class="flex-between" style="margin-bottom:10px; flex-wrap:wrap; gap:10px;">
  <h2 style="margin:0;">📊 الشارت الحي — <span id="chart-symbol-title">—</span></h2>
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <input id="symbol-input" type="text" placeholder="مثال: BTCUSDT" value="BTCUSDT"
           style="width:150px; padding:8px 10px; border-radius:8px; border:1px solid var(--dark-accent); background:var(--card); color:var(--text);">
    <button class="btn secondary" style="padding:8px 14px;" onclick="loadChart()">🔍 تحميل</button>
  </div>
</div>

<div class="card" style="padding:10px; margin-bottom:10px;">
  <div id="tf-buttons" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
</div>

<div id="trade-summary" class="card" style="display:none; margin-bottom:10px;"></div>

<div id="open-symbols-bar" class="muted" style="margin-bottom:10px; font-size:13px; line-height:2;"></div>

<div class="card" style="padding:8px;">
  <div id="chart-container" style="width:100%; height:560px;"></div>
</div>

<div id="signal-levels" class="card" style="margin-top:12px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<script>
let chart, candleSeries, priceLines = [];
let currentInterval = '15m';
const TIMEFRAMES = [
  {v:'5m', l:'5د'}, {v:'15m', l:'15د'}, {v:'1h', l:'1س'}, {v:'4h', l:'4س'}, {v:'1d', l:'يومي'},
];

// صفقة محددة جاية من صفحة الإشارات (زر "عرض الشارت") — لو موجودة نعرضها ونبرزها
// حتى لو ما عادت ضمن الصفقات المفتوحة حالياً (صفقة مقفولة تاريخياً مثلاً)
const urlParams = new URLSearchParams(window.location.search);
const linkedTrade = {
  id: urlParams.get('id'),
  entry: parseFloat(urlParams.get('entry')),
  sl: parseFloat(urlParams.get('sl')),
  tp: parseFloat(urlParams.get('tp')),
};
const hasLinkedTrade = linkedTrade.id && !isNaN(linkedTrade.entry);

function renderTfButtons(){
  const wrap = document.getElementById('tf-buttons');
  wrap.innerHTML = TIMEFRAMES.map(tf => `
    <button onclick="switchInterval('${tf.v}')" id="tf-btn-${tf.v}"
      style="padding:8px 16px; border-radius:8px; border:1px solid var(--dark-accent); cursor:pointer;
             background:${tf.v===currentInterval ? 'var(--cyan)' : 'var(--card)'};
             color:${tf.v===currentInterval ? '#0b0e14' : 'var(--text)'}; font-weight:700; font-size:13px;">
      ${tf.l}
    </button>`).join('');
}

function switchInterval(tf){
  currentInterval = tf;
  renderTfButtons();
  loadChart();
}

function initChart(){
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    layout: { background: { color: 'transparent' }, textColor: '#e5e7eb' },
    grid: { vertLines: { color: '#1c2130' }, horzLines: { color: '#1c2130' } },
    rightPriceScale: { borderColor: '#1c2130' },
    timeScale: { borderColor: '#1c2130', timeVisible: true, secondsVisible: false },
    autoSize: true,
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#22c55e', downColor: '#ef4444',
    borderUpColor: '#22c55e', borderDownColor: '#ef4444',
    wickUpColor: '#22c55e', wickDownColor: '#ef4444',
  });
}

function clearPriceLines(){
  priceLines.forEach(pl => candleSeries.removePriceLine(pl));
  priceLines = [];
}

function addLevel(price, color, title, width){
  if (!price || price <= 0) return;
  const pl = candleSeries.createPriceLine({
    price: price, color: color, lineWidth: width || 2, lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true, title: title,
  });
  priceLines.push(pl);
}

function renderTradeSummary(){
  if (!hasLinkedTrade) return;
  const box = document.getElementById('trade-summary');
  box.style.display = 'block';
  const riskDist = Math.abs(linkedTrade.entry - linkedTrade.sl);
  const rewardDist = Math.abs(linkedTrade.tp - linkedTrade.entry);
  const rr = riskDist > 0 ? (rewardDist / riskDist).toFixed(2) : '—';
  box.innerHTML = `
    <h3 style="margin-top:0; font-size:15px;">🎯 تحليل الصفقة #${linkedTrade.id} على الشارت</h3>
    <div style="display:flex; gap:20px; flex-wrap:wrap;">
      <div><span class="muted">الدخول:</span> <b style="color:#38bdf8;">${linkedTrade.entry}</b></div>
      <div><span class="muted">الوقف:</span> <b style="color:var(--red);">${linkedTrade.sl}</b></div>
      <div><span class="muted">الهدف:</span> <b style="color:var(--green);">${linkedTrade.tp}</b></div>
      <div><span class="muted">عائد/مخاطرة:</span> <b>1:${rr}</b></div>
    </div>`;
}

async function loadChart(){
  const symbol = document.getElementById('symbol-input').value.trim().toUpperCase();
  if (!symbol) return;
  document.getElementById('chart-symbol-title').innerText = symbol;
  try {
    const r = await fetch(`/api/chart-data?symbol=${encodeURIComponent(symbol)}&interval=${currentInterval}&limit=250`);
    const data = await r.json();
    if (data.error){
      document.getElementById('signal-levels').innerHTML = `<p class="muted">تعذر تحميل بيانات ${symbol}: ${data.error}</p>`;
      return;
    }
    candleSeries.setData(data.candles.map(c => ({
      time: c.time, open: c.open, high: c.high, low: c.low, close: c.close,
    })));
    clearPriceLines();

    // الصفقة المحددة (جاية من صفحة الإشارات) تُبرَز بخطوط أوضح وأعرض
    if (hasLinkedTrade){
      addLevel(linkedTrade.entry, '#38bdf8', `دخول #${linkedTrade.id}`, 3);
      addLevel(linkedTrade.sl, '#ef4444', `وقف #${linkedTrade.id}`, 3);
      addLevel(linkedTrade.tp, '#22c55e', `هدف #${linkedTrade.id}`, 3);
      renderTradeSummary();
    }

    const levelsDiv = document.getElementById('signal-levels');
    const otherSignals = data.signals.filter(s => String(s.id) !== String(linkedTrade.id));
    if (!otherSignals.length && !hasLinkedTrade){
      levelsDiv.innerHTML = `<p class="muted">ما فيه صفقة مفتوحة حالياً على ${symbol}.</p>`;
    } else if (otherSignals.length) {
      levelsDiv.innerHTML = '<h3 style="margin-top:0; font-size:15px;">🎯 صفقات مفتوحة أخرى على هذي العملة</h3>' +
        otherSignals.map(s => {
          const sideAr = s.side === 'Long' ? 'شراء 🟢' : 'بيع 🔴';
          addLevel(s.entry_price, '#38bdf8', `دخول #${s.id}`);
          addLevel(s.stop_loss, '#ef4444', `وقف #${s.id}`);
          addLevel(s.take_profit, '#22c55e', `هدف #${s.id}`);
          return `<div style="padding:8px 0; border-bottom:1px solid var(--dark-accent);">
            <b>#${s.id} ${s.strategy}</b> — ${sideAr} — <span class="muted">${s.status}</span><br>
            <span class="muted">دخول: ${s.entry_price} | وقف: ${s.stop_loss} | هدف: ${s.take_profit}</span>
          </div>`;
        }).join('');
    } else {
      levelsDiv.innerHTML = '';
    }
    chart.timeScale().fitContent();
  } catch (e) {
    document.getElementById('signal-levels').innerHTML = `<p class="muted">خطأ: ${e}</p>`;
  }
}

async function loadOpenSymbolsBar(){
  try {
    const r = await fetch('/api/signals');
    const signals = await r.json();
    const open = signals.filter(s => s.status === 'PENDING' || s.status === 'ACTIVE');
    const uniqueSymbols = [...new Set(open.map(s => s.symbol))];
    const bar = document.getElementById('open-symbols-bar');
    if (!uniqueSymbols.length){ bar.innerHTML = ''; return; }
    bar.innerHTML = 'صفقات مفتوحة حالياً: ' + uniqueSymbols.map(sym =>
      `<a href="#" onclick="document.getElementById('symbol-input').value='${sym}'; loadChart(); return false;" style="color:var(--cyan); margin-left:10px;">${sym}</a>`
    ).join(' ');
  } catch (e) { /* تجاهل بصمت */ }
}

initChart();
renderTfButtons();
const symbolFromUrl = urlParams.get('symbol');
if (symbolFromUrl) document.getElementById('symbol-input').value = symbolFromUrl.toUpperCase();
loadChart();
loadOpenSymbolsBar();
// تحديث شبه حي — كل 20 ثانية (بدون WebSocket، يكفي لمتابعة الحركة بدون إثقال المنصة)
setInterval(loadChart, 20000);
</script>

{% endblock %}
